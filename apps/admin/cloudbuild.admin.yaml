steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADMIN_URL=${_NEXT_PUBLIC_ADMIN_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_DEMO_MODE=false'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
      - '-f'
      - 'apps/admin/Dockerfile'
      - 'apps/admin'
    id: 'build-admin'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}'
    id: 'push-admin'
    waitFor: ['build-admin']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_ADMIN_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3001'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},NEXT_PUBLIC_ADMIN_URL=${_NEXT_PUBLIC_ADMIN_URL},NEXT_PUBLIC_DEMO_MODE=false'
    id: 'deploy-admin'
    waitFor: ['push-admin']

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_ADMIN_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

substitutions:
  _REGION: europe-west1
  _REPOSITORY: openstaff-repo
  _ADMIN_SERVICE: openstaff-admin
  _NEXT_PUBLIC_API_URL: https://api.openstaff.eu
  _NEXT_PUBLIC_ADMIN_URL: https://backoffice.openstaff.eu
  _NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBNYTBbbF3DG2V_O0uU41RAxeUajRPBCzs
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: openstaff-platform.firebaseapp.com
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: openstaff-platform
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: openstaff-platform.firebasestorage.app
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '605639023972'
  _NEXT_PUBLIC_FIREBASE_APP_ID: 1:605639023972:web:5d2e4ff83c044ec384ae71
