version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: openstaff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openstaff
      POSTGRES_PASSWORD: openstaff_dev_2024
      POSTGRES_DB: openstaff_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstaff -d openstaff_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
